<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DAM Sets prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE work: a design proposal colleagues act on, then the product itself
   IDEA the DAM as shipped, inside its Unity frame, with a spec page in front of it
   PICTURE the live prototype: Sets list, set detail, lightbox Related tab, rule settings
   COLOUR Scale tokens only: sand surfaces, cerulean for action, meaning colours for state
   TYPE Inter, JetBrains Mono for IDs and URLs
   LAYOUT tester bar on top; proposal reads as one column with a model diagram; prototype views fill the frame */

:root{color-scheme:light dark;
--surface-default:light-dark(#fdfdfc,#12110e);--surface-subtle:light-dark(#f9f9f8,#191918);--surface-muted:light-dark(#f0f0ef,#23231f);--surface-emphasis:light-dark(#e9e9e6,#2b2a21);--surface-hover:light-dark(rgba(16,16,0,.06),rgba(247,247,196,.08));--surface-raised:light-dark(#ffffff,#191918);
--text-default:light-dark(#21201c,#f0efe3);--text-muted:light-dark(#63635e,#b6b5aa);--text-disabled:light-dark(#bcbbb5,#626056);--text-on-primary:light-dark(#ffffff,#12110e);--text-on-media:#ffffff;
--border-subtle:light-dark(#f0f0ef,#23231f);--border-default:light-dark(#dad9d6,#3c3b31);--border-emphasis:light-dark(#cfcfca,#4a493f);
--primary-default:light-dark(#0c818f,#6acad9);--primary-hover:light-dark(#007381,#b3ecf6);--primary-pressed:light-dark(#006c78,#b3ecf6);--primary-text:light-dark(#006c78,#6acad9);--primary-subtle:light-dark(#e3f5f8,#072c31);--primary-subtle-hover:light-dark(#d3eff3,#003941);--primary-muted:light-dark(#c1e6ec,#004750);
--accent-9:#0c818f;
--filetype-badge-bg:rgba(28,28,25,.62);--filetype-badge-fg:#ffffff;
--success-3:light-dark(#e4f7f0,#0d2d24);--success-7:light-dark(#8aceb7,#246854);--success-11:light-dark(#008062,#60d1af);--success-12:light-dark(#1d3b31,#aaf0d8);
--warning-3:light-dark(#fff0cb,#2f200d);--warning-7:light-dark(#fdb757,#704f20);--warning-11:light-dark(#a96600,#fbb554);--warning-12:light-dark(#4d3618,#fce3c4);
--error-3:light-dark(#feebe7,#381710);--error-7:light-dark(#f5a997,#853b2b);--error-9:#e54d2e;--error-11:light-dark(#cf3716,#ff9277);--error-12:light-dark(#5c281c,#fbd3ca);
--info-3:light-dark(#e9f3ff,#0a2847);--info-7:light-dark(#97c5f9,#1d5e9d);--info-11:light-dark(#0073dd,#70b8ff);--info-12:light-dark(#003463,#c8e3ff);
--discovery-3:light-dark(#f5eeff,#2d1c3d);--discovery-7:light-dark(#ceb0ef,#644384);--discovery-11:light-dark(#8145b5,#d29dff);--discovery-12:light-dark(#411f5f,#e9dafc);
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:40px;--space-8:48px;--space-9:64px;
--radius-1:3px;--radius-2:4px;--radius-control:4px;--radius-card:6px;--radius-modal:8px;--radius-pill:9999px;
--font-family-text:"Inter",system-ui,-apple-system,sans-serif;--font-family-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
--font-size-0:11px;--font-size-1:12px;--font-size-2:14px;--font-size-3:16px;--font-size-4:18px;--font-size-5:22px;--font-size-6:24px;--font-size-7:28px;
--line-height-1:16px;--line-height-2:20px;--line-height-3:24px;
--duration-base:200ms;--duration-fast:120ms;--ease-out:cubic-bezier(.16,1,.3,1);
/* Local tokens: not in the Scale token export */
--local-shadow-raised:0 8px 24px light-dark(rgba(33,32,28,.14),rgba(0,0,0,.5));
--local-host-rail:light-dark(#1b3c41,#0f1b1d);
--local-tester:light-dark(#21201c,#3b3a33);
--local-rail-w:56px;--local-dam-rail-w:56px;--local-filter-w:248px;--local-props-w:340px;--local-row-h:64px;--local-thumb:44px}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--surface-default);color:var(--text-default);font:var(--font-size-2)/var(--line-height-2) var(--font-family-text);display:flex;flex-direction:column;overflow:hidden}
#root{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-9);outline-offset:2px}
.mono{font-family:var(--font-family-mono);font-size:var(--font-size-1)}
.muted{color:var(--text-muted)}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.lg{width:20px;height:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Tester bar (Local, not product UI) */
.tbar{position:relative;flex:none;z-index:50;background:var(--local-tester);color:var(--text-on-media);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);padding:var(--space-2) max(var(--space-4),2vw)}
.tbar b{font-weight:600;margin-right:var(--space-2)}
.tgroup{display:flex;flex-wrap:wrap;gap:var(--space-1);align-items:center}
.tgroup span{font-size:var(--font-size-1);opacity:.75;margin-right:var(--space-1)}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--text-on-media);border-radius:var(--radius-control);padding:var(--space-1) var(--space-2);font-size:var(--font-size-1);cursor:pointer;min-height:28px}
.tbtn[aria-pressed=true]{background:var(--text-on-media);color:var(--local-tester);border-color:var(--text-on-media)}
.tspacer{flex:1}

/* Scale components */
.sd-button,[data-scale=IconButton]{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);border-radius:var(--radius-control);border:1px solid transparent;cursor:pointer;font-weight:500;white-space:nowrap;transition:background var(--duration-fast)}
.sd-button{height:32px;padding:0 var(--space-3);font-size:var(--font-size-2)}
.sd-button[data-size="1"]{height:24px;padding:0 var(--space-2);font-size:var(--font-size-1)}
[data-scale=IconButton]{width:32px;height:32px;padding:0;background:transparent;color:var(--text-muted)}
[data-scale=IconButton][data-size="1"]{width:24px;height:24px}
[data-tier=primary]{background:var(--primary-default);color:var(--text-on-primary)}
[data-tier=primary]:hover{background:var(--primary-hover)}
[data-tier=secondary]{background:var(--surface-raised);color:var(--primary-text);border-color:var(--primary-default)}
[data-tier=secondary]:hover{background:var(--primary-subtle)}
[data-tier=tertiary]{background:var(--surface-raised);color:var(--text-default);border-color:var(--border-default)}
[data-tier=tertiary]:hover{background:var(--surface-emphasis)}
[data-tier=ghost]{background:transparent;color:var(--text-muted)}
[data-tier=ghost]:hover{background:var(--surface-emphasis);color:var(--text-default)}
[data-tier=destructive]{background:var(--surface-raised);color:var(--error-11);border-color:var(--error-7)}
[data-tier=destructive]:hover{background:var(--error-3)}
.sd-button:disabled,[data-scale=IconButton]:disabled{opacity:.45;cursor:not-allowed}
.sd-text-field{display:flex;align-items:center;gap:var(--space-2);height:32px;padding:0 var(--space-2);border:1px solid var(--border-emphasis);border-radius:var(--radius-control);background:var(--surface-raised);color:var(--text-muted)}
.sd-text-field input{border:0;background:transparent;outline:0;flex:1;height:100%;color:var(--text-default);font-size:var(--font-size-2)}
.sd-text-field[data-size="1"]{height:28px}
.sd-text-field[data-size="1"] input{font-size:var(--font-size-1)}
.sd-text-field:focus-within{outline:2px solid var(--accent-9);outline-offset:2px}
.sd-text-field[data-readonly=true]{background:var(--surface-muted)}
.sd-select{height:32px;padding:0 var(--space-6) 0 var(--space-2);border:1px solid var(--border-emphasis);border-radius:var(--radius-control);background:var(--surface-raised);appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;cursor:pointer}
.sd-checkbox{display:flex;align-items:center;gap:var(--space-2);cursor:pointer;min-height:28px}
.sd-checkbox input{width:16px;height:16px;accent-color:var(--accent-9);margin:0}
.sd-badge{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 var(--space-2);border-radius:var(--radius-2);font-size:var(--font-size-1);font-weight:500;background:var(--surface-muted);color:var(--text-default);border:1px solid var(--border-default);white-space:nowrap}
.sd-badge[data-status=success]{background:var(--success-3);color:var(--success-12);border-color:var(--success-7)}
.sd-badge[data-status=warning]{background:var(--warning-3);color:var(--warning-12);border-color:var(--warning-7)}
.sd-badge[data-status=error]{background:var(--error-3);color:var(--error-12);border-color:var(--error-7)}
.sd-badge[data-status=info]{background:var(--info-3);color:var(--info-12);border-color:var(--info-7)}
.sd-badge[data-color=primary]{background:var(--primary-subtle);color:var(--primary-text);border-color:var(--primary-muted)}
.sd-badge .ic{width:12px;height:12px}
.sd-callout{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);border:1px solid;font-size:var(--font-size-2)}
.sd-callout[data-status=info]{background:var(--info-3);border-color:var(--info-7);color:var(--info-12)}
.sd-callout[data-status=info] .ic{color:var(--info-11)}
.sd-callout[data-status=warning]{background:var(--warning-3);border-color:var(--warning-7);color:var(--warning-12)}
.sd-callout[data-status=warning] .ic{color:var(--warning-11)}
.sd-callout[data-status=error]{background:var(--error-3);border-color:var(--error-7);color:var(--error-12)}
.sd-callout[data-status=error] .ic{color:var(--error-11)}
.sd-callout .body{flex:1}
.sd-callout .act{margin-left:auto}
.sd-switch{display:inline-flex;align-items:center;gap:var(--space-2);cursor:pointer}
.sd-switch input{appearance:none;width:32px;height:18px;border-radius:var(--radius-pill);background:var(--border-emphasis);position:relative;margin:0;cursor:pointer;transition:background var(--duration-fast)}
.sd-switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:var(--radius-pill);background:var(--surface-raised);transition:transform var(--duration-fast)}
.sd-switch input:checked{background:var(--primary-default)}
.sd-switch input:checked::after{transform:translateX(14px)}
.field-row{display:grid;gap:2px;font-size:var(--font-size-1);line-height:var(--line-height-1)}
.field-row .label{color:var(--text-muted)}
.field-row .value{font-weight:500;display:flex;align-items:center;gap:var(--space-1);overflow-wrap:anywhere}
.field-list{display:grid;gap:var(--space-5)}
.empty-state{display:grid;justify-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-5);color:var(--text-muted)}
.empty-state .icon{width:48px;height:48px;border-radius:var(--radius-pill);background:var(--surface-muted);display:grid;place-items:center;color:var(--text-muted)}
.empty-state[data-tone=error] .icon{background:var(--error-3);color:var(--error-11)}
.empty-state h3{margin:var(--space-2) 0 0;font-size:var(--font-size-3);color:var(--text-default);font-weight:600}
.empty-state p{margin:0;max-width:40ch}
.empty-state .actions{margin-top:var(--space-3);display:flex;gap:var(--space-2)}
.empty-state[data-size=panel]{padding:var(--space-6) var(--space-3)}
.toast-stack{position:fixed;right:var(--space-5);bottom:var(--space-5);display:grid;gap:var(--space-2);z-index:80}
.toast{display:flex;gap:var(--space-2);align-items:center;padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);border:1px solid;box-shadow:var(--local-shadow-raised);max-width:380px;animation:rise var(--duration-base) var(--ease-out)}
.toast[data-status=success]{background:var(--success-3);border-color:var(--success-7);color:var(--success-12)}
.toast[data-status=error]{background:var(--error-3);border-color:var(--error-7);color:var(--error-12)}
.toast[data-status=info]{background:var(--info-3);border-color:var(--info-7);color:var(--info-12)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.menu{position:absolute;right:0;top:calc(100% + var(--space-1));background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-2);box-shadow:var(--local-shadow-raised);padding:var(--space-1);min-width:200px;z-index:30;display:grid}
.menu button{display:flex;gap:var(--space-2);align-items:center;background:none;border:0;text-align:left;padding:var(--space-2);border-radius:var(--radius-2);cursor:pointer}
.menu button:hover{background:var(--surface-emphasis)}
.menu hr{border:0;border-top:1px solid var(--border-subtle);margin:var(--space-1) 0;width:100%}
.menu .danger{color:var(--error-11)}
.scrim{position:fixed;inset:0;background:rgba(18,17,14,.45);display:grid;place-items:center;z-index:70;padding:var(--space-4)}
.dialog{background:var(--surface-raised);border-radius:var(--radius-modal);box-shadow:var(--local-shadow-raised);width:min(560px,100%);max-height:85vh;display:flex;flex-direction:column}
.dialog header{padding:var(--space-5) var(--space-5) var(--space-3)}
.dialog h2{margin:0;font-size:var(--font-size-4);font-weight:600}
.dialog .dbody{padding:0 var(--space-5);overflow:auto}
.dialog footer{display:flex;justify-content:flex-end;gap:var(--space-2);padding:var(--space-4) var(--space-5) var(--space-5)}
.dialog[data-scale=AlertDialog]{width:min(440px,100%)}

/* Proposal */
.doc{max-width:1080px;margin:0 auto;padding:var(--space-7) max(var(--space-4),4vw) var(--space-9)}
.doc h1{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.02em;margin:0 0 var(--space-3);font-weight:700;text-wrap:balance}
.doc .lede{font-size:var(--font-size-4);line-height:1.5;color:var(--text-muted);max-width:68ch;margin:0 0 var(--space-6)}
.doc h2{font-size:var(--font-size-5);line-height:1.3;margin:var(--space-8) 0 var(--space-3);font-weight:600;letter-spacing:-.01em}
.doc p,.doc li{font-size:var(--font-size-3);line-height:1.6;max-width:72ch}
.doc ul{padding-left:var(--space-5)}
.doc li{margin-bottom:var(--space-2)}
.jump{display:flex;flex-wrap:wrap;gap:var(--space-2);margin:var(--space-5) 0 0}
.model{border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--surface-subtle);padding:var(--space-5);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1.2fr) auto minmax(0,1.3fr);align-items:center;gap:var(--space-3)}
.node{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:var(--space-3) var(--space-4)}
.node h4{margin:0 0 var(--space-1);font-size:var(--font-size-2);font-weight:600;display:flex;gap:var(--space-2);align-items:center}
.node p{margin:0;font-size:var(--font-size-1);line-height:1.5;color:var(--text-muted)}
.node.key{border-color:var(--primary-default);background:var(--primary-subtle)}
.node.key p{color:var(--text-default)}
.arrow{color:var(--text-muted);display:grid;place-items:center}
.readers{display:grid;gap:var(--space-2)}
.sim{margin-top:var(--space-3);display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border:1px dashed var(--border-emphasis);border-radius:var(--radius-card);font-size:var(--font-size-2);color:var(--text-muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-5)}
.panel{border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--surface-subtle);padding:var(--space-4) var(--space-5)}
.panel h3{margin:0 0 var(--space-2);font-size:var(--font-size-3);font-weight:600}
.panel ul{margin:0;padding-left:var(--space-4)}
.panel li{font-size:var(--font-size-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--border-default);border-radius:var(--radius-card)}
table{border-collapse:collapse;width:100%;font-size:var(--font-size-2)}
th,td{text-align:left;padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--border-subtle);vertical-align:top}
th{background:var(--surface-muted);font-weight:600;font-size:var(--font-size-1);color:var(--text-muted)}
tr:last-child td{border-bottom:0}
.q{counter-reset:q;list-style:none;padding:0}
.q li{counter-increment:q;padding-left:var(--space-6);position:relative}
.q li::before{content:counter(q);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:var(--radius-pill);background:var(--surface-muted);font-size:var(--font-size-1);display:grid;place-items:center;font-weight:600}
.reco{font-size:var(--font-size-2);color:var(--text-muted)}
@media(max-width:900px){.model{grid-template-columns:minmax(0,1fr)}.arrow{transform:rotate(90deg)}}

/* App frame */
.stagewrap{height:100%;overflow:auto}
.app{display:grid;grid-template-columns:var(--local-rail-w) var(--local-dam-rail-w) minmax(0,1fr);grid-template-rows:48px minmax(0,1fr);height:100%;min-height:600px;min-width:1100px;position:relative}
.host{grid-row:1/3;background:var(--local-host-rail);color:var(--text-on-media);display:flex;flex-direction:column;align-items:center;padding:var(--space-3) 0;gap:var(--space-4)}
.host .logo{font-weight:700;font-size:var(--font-size-5);letter-spacing:-.04em}
.host .ic{opacity:.8}
.crumb{grid-column:2/4;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-5);border-bottom:1px solid var(--border-default);font-size:var(--font-size-2);background:var(--surface-default)}
.crumb b{font-weight:500}
.damrail{border-right:1px solid var(--border-default);background:var(--surface-subtle);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);padding-top:var(--space-3)}
.damrail button{width:40px;height:40px;border-radius:var(--radius-2);border:0;background:transparent;color:var(--text-muted);display:grid;place-items:center;cursor:pointer;position:relative}
.damrail button:hover{background:var(--surface-emphasis)}
.damrail button[aria-current=page]{background:var(--primary-subtle);color:var(--primary-text)}
.damrail button[aria-current=page]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:var(--radius-pill);background:var(--primary-default)}
.damrail hr{width:28px;border:0;border-top:1px solid var(--border-default);margin:var(--space-1) 0}
.main{overflow:auto;background:var(--surface-default);position:relative}

/* Sets list */
.page{display:grid;grid-template-columns:var(--local-filter-w) minmax(0,1fr);height:100%}
.filters{border-right:1px solid var(--border-default);background:var(--surface-subtle);overflow:auto;padding:var(--space-4)}
.filters .fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-3)}
.filters .fh b{font-size:var(--font-size-2);font-weight:600}
.fgroup{border-top:1px solid var(--border-default);padding:var(--space-3) 0}
.fgroup>button{display:flex;align-items:center;gap:var(--space-2);width:100%;background:none;border:0;padding:var(--space-1) 0;font-weight:600;font-size:var(--font-size-1);cursor:pointer;color:var(--text-default)}
.fgroup .tri{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;transition:transform var(--duration-fast)}
.fgroup[data-open=false] .tri{transform:rotate(-90deg)}
.fgroup[data-open=false] .opts{display:none}
.opts{display:grid;gap:2px;margin-top:var(--space-1)}
.opts .sd-checkbox{font-size:var(--font-size-1);justify-content:space-between}
.opts .sd-checkbox span:first-of-type{display:flex;align-items:center;gap:var(--space-2)}
.opts .count{color:var(--text-muted);font-size:var(--font-size-0)}
.daterow{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-2)}
.daterow input{height:28px;border:1px solid var(--border-emphasis);border-radius:var(--radius-control);background:var(--surface-raised);padding:0 var(--space-2);font-size:var(--font-size-1);width:100%}
.content{overflow:auto;padding:var(--space-5) var(--space-6)}
.phead{display:flex;align-items:flex-start;gap:var(--space-4);margin-bottom:var(--space-4)}
.phead h1{margin:0;font-size:var(--font-size-6);line-height:32px;font-weight:600;display:flex;align-items:center;gap:var(--space-2)}
.phead p{margin:var(--space-1) 0 0;color:var(--text-muted);max-width:70ch}
.phead .right{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-3)}
.toolbar .sd-text-field{flex:1 1 360px;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;margin-bottom:var(--space-4);min-height:24px}
.chip{display:inline-flex;align-items:center;gap:var(--space-1);height:24px;padding:0 var(--space-1) 0 var(--space-2);border-radius:var(--radius-pill);background:var(--primary-subtle);color:var(--primary-text);font-size:var(--font-size-1);border:0;cursor:pointer}
.chip .ic{width:12px;height:12px}
.linkbtn{background:none;border:0;color:var(--primary-text);cursor:pointer;font-size:var(--font-size-1);padding:var(--space-1)}
.viewtoggle{display:inline-flex;border:1px solid var(--border-default);border-radius:var(--radius-control);overflow:hidden;background:var(--surface-raised)}
.viewtoggle button{width:36px;height:30px;border:0;background:transparent;color:var(--text-muted);display:grid;place-items:center;cursor:pointer}
.viewtoggle button[aria-pressed=true]{background:var(--primary-subtle);color:var(--primary-text)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-4)}
.setcard{border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--surface-raised);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.setcard:hover{border-color:var(--border-emphasis);background:var(--surface-subtle)}
.cover{aspect-ratio:1;position:relative;background:var(--surface-muted)}
.cover>svg{position:absolute;inset:0;width:100%;height:100%}
.ftype{position:absolute;right:var(--space-2);bottom:var(--space-2);background:var(--filetype-badge-bg);color:var(--filetype-badge-fg);font-size:var(--font-size-0);font-weight:600;padding:0 var(--space-1);border-radius:var(--radius-1);line-height:18px}
.countpill{position:absolute;left:var(--space-2);top:var(--space-2);background:var(--filetype-badge-bg);color:var(--filetype-badge-fg);font-size:var(--font-size-1);font-weight:600;padding:var(--space-1) var(--space-2);border-radius:var(--radius-pill);line-height:var(--line-height-1);display:flex;gap:var(--space-1);align-items:center}
.countpill .ic{width:14px;height:14px}
.cmeta{padding:var(--space-3);display:grid;gap:var(--space-1)}
.cmeta .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta .sub{display:flex;justify-content:space-between;gap:var(--space-2);align-items:center;color:var(--text-muted)}
.skel{background:linear-gradient(90deg,var(--surface-muted),var(--surface-emphasis),var(--surface-muted));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:var(--radius-2)}

.grid{border:1px solid var(--border-default);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-raised)}
.grid table td{vertical-align:middle}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover{background:var(--surface-subtle)}
.tthumb{width:40px;height:40px;border-radius:var(--radius-2);overflow:hidden;position:relative;background:var(--surface-muted)}
.tthumb svg{width:100%;height:100%}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-5);color:var(--text-muted);font-size:var(--font-size-1)}
.pager .pg{display:flex;gap:var(--space-1)}

/* Set detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) var(--local-props-w);height:100%}
.dmain{overflow:auto;padding:var(--space-5) var(--space-6)}
.dhead{display:flex;gap:var(--space-4);align-items:flex-start;margin-bottom:var(--space-4)}
.dhead h1{margin:var(--space-3) 0 var(--space-1);font-size:var(--font-size-6);font-weight:600;line-height:32px}
.dhead .meta{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;color:var(--text-muted)}
.dhead .right{margin-left:auto;display:flex;gap:var(--space-2);align-items:center;position:relative;padding-top:var(--space-1)}
.hint{color:var(--text-muted);font-size:var(--font-size-1);margin:var(--space-4) 0 var(--space-2)}
.rows{display:grid;gap:var(--space-2)}
.mrow{display:grid;grid-template-columns:28px 24px var(--local-thumb) minmax(0,1fr) 168px auto;align-items:center;gap:var(--space-3);min-height:var(--local-row-h);padding:var(--space-2) var(--space-3);border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--surface-raised)}
.mrow.drag{opacity:.4}
.mrow.over{border-color:var(--primary-default);background:var(--primary-subtle)}
.grip{width:28px;height:32px;border:0;background:none;color:var(--text-muted);cursor:grab;border-radius:var(--radius-2);display:grid;place-items:center}
.grip:hover{background:var(--surface-emphasis)}
.pos{color:var(--text-muted);font-variant-numeric:tabular-nums;text-align:right}
.thumb{width:var(--local-thumb);height:var(--local-thumb);border-radius:var(--radius-2);overflow:hidden;position:relative;border:0;padding:0;cursor:zoom-in;background:var(--surface-muted)}
.thumb svg{width:100%;height:100%;display:block}
.fname{display:grid;gap:2px}
.fname .f{font-weight:500;overflow-wrap:anywhere}
.fname .tags{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.racts{display:flex;gap:var(--space-1)}
.excl{margin-top:var(--space-5);border-top:1px solid var(--border-default);padding-top:var(--space-4)}
.excl h3{font-size:var(--font-size-2);font-weight:600;margin:0 0 var(--space-1)}
.props{border-left:1px solid var(--border-default);background:var(--surface-subtle);overflow:auto;padding:var(--space-5)}
.props h2{font-size:var(--font-size-4);font-weight:600;margin:0 0 var(--space-4)}
.props h3{font-size:var(--font-size-2);font-weight:600;margin:var(--space-6) 0 var(--space-3);display:flex;align-items:center;gap:var(--space-2)}
.urlrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--space-2);align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--border-default)}
.urlrow:last-child{border-bottom:0}
.urlrow .mono{overflow-wrap:anywhere;color:var(--text-default)}
.urlrow .lab{font-size:var(--font-size-0);font-weight:600;color:var(--text-muted);min-width:36px}
.note{font-size:var(--font-size-1);color:var(--text-muted);margin:var(--space-2) 0 0;line-height:1.5}

/* Lightbox */
.lb{position:absolute;inset:0;background:var(--surface-default);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;z-index:20}
.lbtop{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border-default)}
.lbtop .nav{display:flex;align-items:center;gap:var(--space-1)}
.lbtop .counter{font-size:var(--font-size-1);color:var(--text-muted);font-variant-numeric:tabular-nums;margin-right:var(--space-2)}
.lbtop .title{display:grid}
.lbtop .title b{font-weight:600}
.lbtop .title span{font-size:var(--font-size-1);color:var(--text-muted)}
.lbtop .acts{margin-left:auto;display:flex;gap:var(--space-2);align-items:center}
.banner{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--info-7);background:var(--info-3);color:var(--info-12);font-size:var(--font-size-2)}
.banner .ic{color:var(--info-11)}
.banner .sd-button{margin-left:auto}
.lbbody{display:grid;grid-template-columns:minmax(0,1fr) 340px 52px;min-height:0}
.lbstage{display:grid;place-items:center;background:var(--surface-muted);padding:var(--space-6);min-height:0}
.lbstage .art{height:100%;max-height:560px;aspect-ratio:1;border-radius:var(--radius-2);overflow:hidden;box-shadow:var(--local-shadow-raised);background:var(--surface-raised)}

.lbrail{border-left:1px solid var(--border-default);background:var(--surface-subtle);display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding-top:var(--space-2)}

.lbrail .new{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:var(--radius-pill);background:var(--discovery-11)}
.relgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3);margin-top:var(--space-4)}
.rel{border:1px solid var(--border-default);border-radius:var(--radius-card);overflow:hidden;background:var(--surface-raised);cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column}
.rel:hover{border-color:var(--border-emphasis)}
.rel[aria-current=true]{border-color:var(--primary-default);box-shadow:0 0 0 1px var(--primary-default)}
.rel .cover{aspect-ratio:1}
.rel .rm{padding:var(--space-2);display:flex;justify-content:space-between;align-items:center;gap:var(--space-1);font-size:var(--font-size-1)}
.rel .rm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbfoot{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-top:1px solid var(--border-default);font-size:var(--font-size-1);color:var(--text-muted)}
.kbd{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-2);border:1px solid var(--border-default);border-radius:var(--radius-2);background:var(--surface-subtle)}
.tagchips{display:flex;flex-wrap:wrap;gap:var(--space-1)}

.settings{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.snav{border-right:1px solid var(--border-default);background:var(--surface-subtle);padding:var(--space-4) var(--space-3);display:grid;align-content:start;gap:2px}

.snav button{text-align:left;border:0;background:none;padding:var(--space-2);border-radius:var(--radius-2);cursor:pointer;color:var(--text-default)}
.snav button:hover{background:var(--surface-emphasis)}
.snav button[aria-current=page]{background:var(--primary-subtle);color:var(--primary-text);font-weight:500}

.sbody .phead{grid-column:1/-1;margin:0}
.form{display:grid;gap:var(--space-5);align-content:start}
.fe{display:grid;gap:var(--space-1)}
.fe label,.fe .lbl{font-size:var(--font-size-1);font-weight:500}
.fe .help{font-size:var(--font-size-1);color:var(--text-muted)}
.radios{display:grid;gap:var(--space-2)}
.radios label{display:flex;gap:var(--space-2);align-items:flex-start;cursor:pointer;font-size:var(--font-size-2)}
.radios input{accent-color:var(--accent-9);margin-top:3px}

.sfoot{display:flex;gap:var(--space-2);padding-top:var(--space-2)}
.preview{border:1px solid var(--border-default);border-radius:var(--radius-card);background:var(--surface-subtle);padding:var(--space-4);display:grid;gap:var(--space-3);align-content:start}
.preview h3{margin:0;font-size:var(--font-size-3);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.stat{background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-card);padding:var(--space-3)}
.stat b{display:block;font-size:var(--font-size-5);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:var(--font-size-1);color:var(--text-muted)}
.bars{display:grid;gap:var(--space-2)}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 56px;gap:var(--space-2);align-items:center;font-size:var(--font-size-1)}
.bar i{display:block;height:8px;border-radius:var(--radius-pill);background:var(--primary-default)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.ok{color:var(--success-11)}
.no{color:var(--warning-11)}

const parse=(f,i)=>{if(ATTRV[S.rule.by]){const g=ATTRV[S.rule.by][i];const m=f.match(/_([A-Za-z0-9]+)\.\w+$/);const allowed=S.rule.allowed.split(',').map(x=>x.trim()).filter(Boolean);const l=S.rule.label==='suffix'&&m&&(!allowed.length||allowed.includes(m[1]))?m[1]:'';return g?{ok:true,g,l}:{ok:false,why:'Attribute is empty on this asset'}}

/* ---------- Proposal ---------- */
const proposal=()=>`<article class="doc">
<h1>Sets</h1>
<p class="lede">One mechanism and one name, built for every client. A rule in DAM settings decides which assets belong together and groups them into sets. A set is managed in Sets, shown on the Set tab in the lightbox, and published to the CDN when a client needs it. The retail client's image sets are the first use, not the reason it exists.</p>
<div class="model" role="img" aria-label="Model: rule feeds membership engine, which writes set records, read by Sets manager, lightbox Related tab and CDN delivery">
 <div class="node"><h4>${ic('sliders-horizontal')}Rule</h4><p>DAM settings, per folder. Group by a field, label from the filename or an attribute, order, publish on or off.</p></div>
 <div class="arrow">${ic('chevron-right','lg')}</div>
 <div class="node"><h4>${ic('refresh-cw')}Membership engine</h4><p>Runs on upload, metadata edit and delete. Manual edits are pinned, so a rule run never undoes them.</p></div>
 <div class="arrow">${ic('chevron-right','lg')}</div>
 <div class="node key"><h4>${ic('gallery-horizontal-end')}Set record</h4><p>Fixed ID. Group value. Rule or hand. Ordered members, each with a label. Position 1 is the cover. Publish status.</p></div>
 <div class="arrow">${ic('chevron-right','lg')}</div>
 <div class="readers"><div class="node"><h4>${ic('gallery-horizontal-end')}Sets manager</h4><p>Find by GTIN, reorder, label, publish</p></div><div class="node"><h4>${ic('library')}Lightbox, Set tab</h4><p>The other assets in this asset's set</p></div><div class="node"><h4>${ic('globe')}CDN delivery</h4><p>Optional. Live URLs by label</p></div></div>
</div>
<div class="sim">${ic('equal-approximately')}<span><b style="color:var(--text-default)">Similar stays separate.</b> It is worked out from visual similarity, stores nothing and has no settings. It shares only the lightbox behaviour with the Set tab: open the asset, actions apply to it, Back to original (SCR-446).</span></div>
<div class="jump">${btn('primary','Open the prototype','go',{data:'data-v="sets"',icon:'gallery-horizontal-end'})}${btn('tertiary','Set detail','go',{data:'data-v="detail"'})}${btn('tertiary','Lightbox, Set tab','go',{data:'data-v="lightbox"'})}${btn('tertiary','Rule settings','go',{data:'data-v="settings"'})}</div>

<h2>One name: Sets</h2>
<p>The Set tab in the lightbox and the Sets screen are the same thing seen from two places: one asset, or all of them. They share one name and one icon. "Related" is left free on purpose. In Bynder, Frontify and AEM Assets, related assets means links made by hand between individual assets, such as a licence file attached to an image or a PSD marked as the source of a JPG. If Screendragon adds that later, it gets that name without clashing with Sets.</p>
<div class="tablewrap"><table><thead><tr><th>Field</th><th>What it holds</th><th>Why</th></tr></thead><tbody>
<tr><td>Set ID</td><td>Fixed once created</td><td>Live CDN links use it. Renaming would break them.</td></tr>
<tr><td>Group value</td><td>GTIN, style code, shoot ID, or none for a hand-made set</td><td>Lets the engine find the set when a new asset arrives</td></tr>
<tr><td>Source</td><td>Rule or hand</td><td>Tells people and the engine who owns the membership</td></tr>
<tr><td>Members</td><td>Ordered list of asset, label and pinned flag</td><td>Order is the display order; pinned keeps hand edits safe from rule runs</td></tr>
<tr><td>Excluded</td><td>Assets removed by hand</td><td>The rule won't add them back</td></tr>
<tr><td>Publish status</td><td>Published, unpublished changes, failed, with time</td><td>Saving and going live are separate steps</td></tr>
</tbody></table></div>

<h2>How the rule decides</h2>
<ul>
<li><b>Group by any single-value attribute</b>, not a fixed list. GTIN, style code, shoot ID, campaign and brand are all attributes already, so a hardcoded list would only be a shorter version of the same thing. Three guardrails keep it simple: one attribute per rule (no AND or OR), exact match only, and multi-value or free-text attributes can't be picked, because one asset would land in many sets.</li>
<li><b>Preview before saving.</b> The settings screen shows group sizes for the chosen attribute. GTIN gives sets of two to four. Brand gives sets of tens of thousands, and filters already cover that, so the screen warns rather than blocks.</li>
<li><b>Filename as a source.</b> Where the value is only in the filename (barcode naming), the rule reads it on upload and saves it into the attribute. The attribute stays the one source of truth, so search, filters and the rule all agree.</li>
<li><b>Labels</b> come from the filename (T1, T2, T3 or A, B, C, set per folder, so the apparel brand's lettering needs no special code) or from an attribute. The allowed list sets the order.</li>
<li><b>Runs on events</b>: upload, metadata change, delete. Turning a rule on for an existing folder runs as a background job.</li>
<li><b>Hand edits win.</b> Removing an asset excludes it; adding one pins it. A later rule run respects both.</li>
</ul>

<h2>What changes from the current build</h2>
<div class="cols">
<div class="panel"><h3>Keep</h3><ul><li>Sets in the DAM rail, list and detail screens</li><li>Create set and Add to set from library selection</li><li>Drag to reorder, per-asset label, copy set ID</li><li>Search by GTIN, set ID or name</li></ul></div>
<div class="panel"><h3>Change</h3><ul><li>Filters move to a left panel, matching Library and Collections</li><li>Card shows the cover (position 1), not a 2 × 2 grid that breaks on one-asset sets</li><li>Set ID read-only after creation</li><li>Save becomes Publish changes, with clear unpublished and failed states</li><li>Properties panel with CDN URLs and copy</li><li>Add assets from inside the set</li><li>Delete moves into the More menu with a confirmation</li></ul></div>
</div>

<h2>Decisions to confirm before tickets</h2>
<ol class="q">
<li><b>Can an asset sit in more than one set?</b> <span class="reco">Recommend: one rule-built set per asset per folder, any number of hand-made sets. The Set tab shows the rule-built set first.</span></li>
<li><b>Live URLs by label or by position?</b> <span class="reco">Recommend label. Reordering then can't change what a live URL serves. Only the cover URL follows position 1.</span></li>
<li><b>What happens when an asset's GTIN changes?</b> <span class="reco">Recommend: it moves to the new set and leaves an entry in the old set's audit trail. If it was pinned, it stays and the set is flagged.</span></li>
<li><b>Bulk edits inside a set.</b> <span class="reco">Hold until the retail client gives a use case. Removing many assets from a live set is the risk.</span></li>
<li><b>Copy link permission.</b> <span class="reco">Follows the existing rule: Copy link follows Download.</span></li>
<li><b>Name.</b> <span class="reco">Sets, everywhere: rail, lightbox tab, settings. Image sets is another vendor's term and sets can hold video; Related is kept for manual links between assets.</span></li>
</ol>

<h2>Tickets this becomes</h2>
<div class="tablewrap"><table><thead><tr><th>Ticket</th><th>Scope</th></tr></thead><tbody>
<tr><td class="mono">SCR-446</td><td>Similar assets: open in lightbox. Created, cycle 14.</td></tr>
<tr><td>Relationship rules and membership engine</td><td>Settings screen, rule model, event handling, pinning, backfill job</td></tr>
<tr><td>Sets manager</td><td>List with filter panel, detail with properties and CDN panel, add assets, publish</td></tr>
<tr><td>Set tab in the lightbox</td><td>New rail destination, reuses the SCR-446 context switch</td></tr>
</tbody></table></div>

<h2>Scale notes for the build</h2>
<ul>
<li><b>Built:</b> Button, IconButton, TextField, FormElement, Select, Checkbox, RadioGroup, Switch, Badge, Callout, Toast, EmptyState, FieldRow, ViewToggle, TabbedPanel (lightbox rail), Sidebar (DAM rail), DropdownMenu, AlertDialog, Dialog, DisclosureTriangle, Grid.</li>
<li><b>Planned:</b> PlannedFilterPanel (sets list), PlannedPagination, PlannedAssetCard pattern for the Related grid.</li>
<li><b>Local:</b> LocalSetCard, because the Collection Card's mosaic is wrong for sets of one; a cover, a count pill, name and GTIN, and a badge only when the set needs attention (unpublished changes or a failed publish). The lightbox context banner reuses the lightbox status banner.</li>
<li><b>Icon:</b> Lucide <span class="mono">gallery-horizontal-end</span> for Sets in the DAM rail and for the Set tab in the lightbox, so the two read as one thing. <span class="mono">layers</span> stays with artboards.</li>
<li><b>Design contract change:</b> Set is a new lightbox rail destination after Similar. The lightbox contract lists the rail set, so the contract needs updating with this.</li>
</ul>
<p class="note">All product names, GTINs, people and URLs on this page are sample content.</p>
</article>`;

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.dlg){S.dlg=null;render()}else if(S.menu){S.menu=false;render()}else if(S.view==='lightbox'){S.view=S.under||'sets';S.lb=null;render()}}
 const g=e.target.closest&&e.target.closest('.grip');if(g&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();const s=setById(S.set),i=+g.dataset.i,j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=s.members.length)return;[s.members[i],s.members[j]]=[s.members[j],s.members[i]];markDirty(s);render();document.querySelector(`.grip[data-i="${j}"]`)?.focus()}
 if(e.key==='Enter'&&e.target.matches('tr[data-act=openset]')){S.set=e.target.dataset.id;go('detail')}});
let dragI=null;
document.addEventListener('dragstart',e=>{const r=e.target.closest('.mrow');if(!r)return;dragI=+r.dataset.row;r.classList.add('drag');e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const r=e.target.closest('.mrow');if(!r||dragI===null)return;e.preventDefault();document.querySelectorAll('.mrow.over').forEach(x=>x.classList.remove('over'));r.classList.add('over')});
document.addEventListener('drop',e=>{const r=e.target.closest('.mrow');if(!r||dragI===null)return;e.preventDefault();const s=setById(S.set),to=+r.dataset.row;const [m]=s.members.splice(dragI,1);s.members.splice(to,0,m);dragI=null;if(to!==dragI)markDirty(s);render()});
document.addEventListener('dragend',()=>{dragI=null;document.querySelectorAll('.mrow').forEach(x=>x.classList.remove('drag','over'))});
const hv=()=>{const h=location.hash.slice(1);if(['sets','detail','lightbox','settings','proposal'].includes(h))go(h)};
window.addEventListener('hashchange',hv);
new ResizeObserver(()=>document.documentElement.style.setProperty('--local-tbar-h',document.getElementById('tbar').offsetHeight+'px')).observe(document.getElementById('tbar'));
render();hv();
}
</script>
</body>
</html>
